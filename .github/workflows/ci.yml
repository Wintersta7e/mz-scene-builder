name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Drop GITHUB_TOKEN to read-only — CI never writes back to the repo.
permissions:
  contents: read

# Cancel in-flight runs on the same ref; saves CI minutes when a branch
# is force-pushed or a PR is rebased.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc -p jsconfig.json --noEmit

      - name: Security audit
        run: npm audit --omit=dev

      - name: Tests with coverage
        run: npx jest --coverage
        env:
          NODE_OPTIONS: --experimental-vm-modules
